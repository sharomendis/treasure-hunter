<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Treasure Hunter – Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="assets/img/avataboyingameplay.png" alt="Treasure hunter boy" class="auth-hero">
    <h1 class="logo">Treasure Hunter</h1>
    <p class="tagline">Reach the treasure before the sun goes down!</p>

    <div class="tabs">
      <button id="tabLogin" class="tab active">Log in</button>
      <button id="tabSignup" class="tab">Sign up</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form">
      <input id="loginEmail" type="email" placeholder="Email" required autocomplete="email">
      <input id="loginPassword" type="password" placeholder="Password" required autocomplete="current-password">
      <label class="check"><input id="remember" type="checkbox" checked> Remember me</label>
      <button class="btn primary" type="submit">Log in</button>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form hidden">
      <input id="signupName" type="text" placeholder="Player name" required minlength="3" maxlength="16">
      <input id="signupEmail" type="email" placeholder="Email" required autocomplete="email">
      <input id="signupPassword" type="password" placeholder="Password (6+ chars, 1 number)" required autocomplete="new-password">
      <input id="signupConfirm" type="password" placeholder="Confirm password" required autocomplete="new-password">
      <button class="btn primary" type="submit">Create account</button>
    </form>

    <!-- GOOGLE SIGN-IN (works for both log in and sign up) -->
    <div id="googleBox">
      <div class="divider"><span>or</span></div>
      <button id="googleBtn" class="btn google" type="button">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.4-4.7 7.1l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.5z"/>
          <path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <p id="authMsg" class="msg"></p>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
